{% extends 'base.html' %}
{% block title %}Reset password — TournamentSC{% endblock %}
{% block content %}
<section class="section wrap" style="max-width:440px">
  <h1>Reset your password</h1>
  <p class="muted">Enter your email and we'll send a reset link.</p>
  <form method="post" class="panel" style="margin-top:20px">
    {% csrf_token %}
    {% include 'partials/form.html' %}
    <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
  </form>
</section>
{% endblock %}
