{% extends 'base.html' %}
{% block title %}My profile — {{ site_conf.site_name }}{% endblock %}
{% block content %}
<section class="section wrap" style="max-width:640px">
  <a class="dim" href="{% url 'player_dashboard' %}">← My dashboard</a>
  <h1 style="margin-top:10px">My profile</h1>

  <form method="post" enctype="multipart/form-data" class="panel tblcard" style="margin-top:20px">
    {% csrf_token %}
    {% include 'partials/form.html' %}
    <div class="row-flex" style="margin-top:16px">
      <button class="btn btn-primary" type="submit">Save profile</button>
      <a class="btn btn-ghost" href="{% url 'player_dashboard' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
