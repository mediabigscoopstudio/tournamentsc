{% extends 'base.html' %}
{% block content %}
<section class="section wrap" style="max-width:440px">
  <h1>Set a new password</h1>
  {% if validlink %}
    <form method="post" class="panel" style="margin-top:20px">
      {% csrf_token %}
      {% include 'partials/form.html' %}
      <button class="btn btn-primary btn-block" type="submit">Change password</button>
    </form>
  {% else %}
    <div class="msg error" style="margin-top:20px">This reset link is invalid or has expired. <a href="/password-reset">Request a new one</a>.</div>
  {% endif %}
</section>
{% endblock %}
